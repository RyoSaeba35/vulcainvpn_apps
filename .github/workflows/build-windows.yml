name: Build Windows

on:
  push:
    tags:
      - 'v*'       # both platforms
      - 'win-v*'   # Windows only
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # Keep the sing-box zips between runs: once cached, builds don't depend
      # on GitHub release downloads (which sometimes answer 504)
      - name: Cache sing-box binaries
        id: singbox-cache
        uses: actions/cache@v4
        with:
          path: |
            amd64.zip
            arm64.zip
          key: sing-box-1.12.22-windows

      - name: Download sing-box binaries
        if: steps.singbox-cache.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $base = "https://github.com/SagerNet/sing-box/releases/download/v1.12.22"
          foreach ($arch in @("amd64", "arm64")) {
            $url = "$base/sing-box-1.12.22-windows-$arch.zip"
            for ($i = 1; $i -le 6; $i++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile "$arch.zip" -TimeoutSec 120
                break
              } catch {
                if ($i -eq 6) { throw }
                Write-Host "Download of $arch failed (attempt $i), retrying in 30 s..."
                Start-Sleep -Seconds 30
              }
            }
          }

      - name: Extract sing-box binaries
        shell: powershell
        run: |
          Expand-Archive -Path "amd64.zip" -DestinationPath "amd64" -Force
          Expand-Archive -Path "arm64.zip" -DestinationPath "arm64" -Force

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows
        run: flutter build windows --release

      - name: Copy sing-box binaries to output
        shell: powershell
        run: |
          Copy-Item "amd64\sing-box-1.12.22-windows-amd64\sing-box.exe" -Destination "build\windows\x64\runner\Release\sing-box-amd64.exe"
          Copy-Item "arm64\sing-box-1.12.22-windows-arm64\sing-box.exe" -Destination "build\windows\x64\runner\Release\sing-box-arm64.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: iscc installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulcain_vpn_windows
          path: installer-output/VulcainVPN-Setup-*.exe
          retention-days: 7

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: installer-output/VulcainVPN-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
