name: Build Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Download sing-box binaries
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.12.22/sing-box-1.12.22-windows-amd64.zip" -OutFile "amd64.zip"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.12.22/sing-box-1.12.22-windows-arm64.zip" -OutFile "arm64.zip"
          Expand-Archive -Path "amd64.zip" -DestinationPath "amd64"
          Expand-Archive -Path "arm64.zip" -DestinationPath "arm64"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows
        run: flutter build windows --release

      - name: Copy sing-box binaries to output
        shell: powershell
        run: |
          Copy-Item "amd64\sing-box-1.12.22-windows-amd64\sing-box.exe" -Destination "build\windows\x64\runner\Release\sing-box-amd64.exe"
          Copy-Item "arm64\sing-box-1.12.22-windows-arm64\sing-box.exe" -Destination "build\windows\x64\runner\Release\sing-box-arm64.exe"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: iscc installer.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/VulcainVPN-Setup.exe
