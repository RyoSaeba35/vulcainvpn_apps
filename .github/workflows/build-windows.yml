name: Build Windows

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Download sing-box binaries
        run: |
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.12.22/sing-box-1.12.22-windows-amd64.zip" -o amd64.zip
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v1.12.22/sing-box-1.12.22-windows-arm64.zip" -o arm64.zip
          Expand-Archive -Path amd64.zip -DestinationPath amd64
          Expand-Archive -Path arm64.zip -DestinationPath arm64
          copy amd64\sing-box-1.12.22-windows-amd64\sing-box.exe windows\runner\sing-box-amd64.exe
          copy arm64\sing-box-1.12.22-windows-arm64\sing-box.exe windows\runner\sing-box-arm64.exe
        shell: powershell

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
