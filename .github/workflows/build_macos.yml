name: Build macOS

on:
  push:
    tags:
      - 'v*'       # both platforms
      - 'mac-v*'   # macOS only
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Remove win_toast from pubspec
        run: |
          sed -i '' 's/.*win_toast.*//' pubspec.yaml

      - name: Relax SDK constraint in pubspec
        run: |
          sed -i '' "s/sdk: \^3\.10\.4/sdk: '>=3.5.0 <4.0.0'/" pubspec.yaml

      - name: Stub out WindowsNotificationService for macOS build
        run: |
          python3 -c "
          content = '''// Stub for macOS build
          class WindowsNotificationService {
            static Future<void> initialize() async {}
            static Future<void> showToast({required String title, required String message, bool isError = false}) async {}
            static Future<void> focusWindow() async {}
            static Future<void> showCriticalAlert({required String title, required String message}) async {}
          }
          '''
          with open('lib/services/windows_notification_service.dart', 'w') as f:
              f.write(content)
          "

      - name: Add MacosNotificationService import to main.dart
        run: |
          sed -i '' "s|import 'services/windows_notification_service.dart';|import 'services/windows_notification_service.dart';\nimport 'services/macos_notification_service.dart';|" lib/main.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd macos
          pod install

      - name: Build macOS app
        run: flutter build macos --release

      - name: Bundle sing-box binaries into app
        run: |
          SING_BOX_VERSION="1.13.11"
          APP_NAME=$(ls build/macos/Build/Products/Release/ | grep "\.app$" | head -1)
          echo "Detected app: $APP_NAME"
          APP_RESOURCES="build/macos/Build/Products/Release/${APP_NAME}/Contents/Resources"
          mkdir -p "$APP_RESOURCES"

          echo "Downloading Intel (amd64)..."
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-darwin-amd64.tar.gz" -o /tmp/sing-box-amd64.tar.gz
          tar -xzf /tmp/sing-box-amd64.tar.gz -C /tmp
          cp "/tmp/sing-box-${SING_BOX_VERSION}-darwin-amd64/sing-box" "$APP_RESOURCES/sing-box-amd64"
          chmod +x "$APP_RESOURCES/sing-box-amd64"

          echo "Downloading Apple Silicon (arm64)..."
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-darwin-arm64.tar.gz" -o /tmp/sing-box-arm64.tar.gz
          tar -xzf /tmp/sing-box-arm64.tar.gz -C /tmp
          cp "/tmp/sing-box-${SING_BOX_VERSION}-darwin-arm64/sing-box" "$APP_RESOURCES/sing-box-arm64"
          chmod +x "$APP_RESOURCES/sing-box-arm64"

          echo "Binaries bundled:"
          ls -lh "$APP_RESOURCES/"

      - name: Compress app bundle
        run: |
          cd build/macos/Build/Products/Release
          APP_NAME=$(ls | grep "\.app$" | head -1)
          zip -r vulcain_vpn_macos.zip "$APP_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulcain_vpn_macos
          path: build/macos/Build/Products/Release/vulcain_vpn_macos.zip
          retention-days: 7
