workflows:
  ios-vulcainvpn:
    name: VulcainVPN iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: vulcainvpn_asc_key
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.vulcainvpn.app"
        EXT_BUNDLE_ID: "com.vulcainvpn.app.PacketTunnel"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing (main app + extension)
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          app-store-connect fetch-signing-files "$EXT_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter pub get
        script: flutter packages pub get

      - name: Strip alpha channel from App Store icon
        script: |
          brew list imagemagick &>/dev/null || brew install imagemagick
          find ios/Runner/Assets.xcassets/AppIcon.appiconset -name "*1024*.png" | while read -r icon; do
            magick "$icon" -background white -alpha remove -alpha off "$icon"
            echo "Stripped alpha from $icon"
          done

      - name: Build sing-box iOS framework
        script: |
          git clone --branch v1.13.0-rc.1 --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box

          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

          gomobile bind -v -target=ios,iossimulator \
            -tags "with_wireguard,with_quic,with_utls,with_dhcp,with_gvisor,with_clash_api" \
            -o "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" \
            ./experimental/libbox

          echo "=== DUMPING GENERATED OBJECTIVE-C HEADER (Libbox.objc.h) ==="
          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -name "Libbox.objc.h" | head -1 | xargs cat
          echo "=== END HEADER DUMP ==="

          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -name "Info.plist" -path "*Libbox.framework*" | while read -r plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.vulcainvpn.app.PacketTunnel.Libbox" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.vulcainvpn.app.PacketTunnel.Libbox" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$plist"
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 13.0" "$plist"
            echo "Patched $plist"
          done

          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -type d -name "Libbox.framework" | while read -r framework; do
            if [ -d "$framework/Versions" ]; then
              echo "Flattening versioned bundle: $framework"
              flat_tmp=$(mktemp -d)
              cp -RL "$framework/Versions/Current/." "$flat_tmp/"
              rm -rf "$framework"
              mkdir -p "$framework"
              cp -R "$flat_tmp/." "$framework/"
              rm -rf "$flat_tmp"
              echo "Flattened $framework"
            fi
            if [ -f "$framework/Resources/Info.plist" ] && [ ! -f "$framework/Info.plist" ]; then
              mv "$framework/Resources/Info.plist" "$framework/Info.plist"
              echo "Moved Info.plist to framework root in $framework"
            fi
            if [ -d "$framework/Resources" ] && [ -z "$(ls -A "$framework/Resources")" ]; then
              rmdir "$framework/Resources"
            fi
          done

      - name: Flutter build ipa
        script: |
          flutter build ipa --release --verbose \
            --build-number=$(date +%s) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  macos-vulcainvpn:
    name: VulcainVPN macOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: vulcainvpn_asc_key
    environment:
      groups:
        - macos_signing
      vars:
        BUNDLE_ID: "com.vulcainvpn.app.macos"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Developer ID signing
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          keychain initialize
          keychain add-certificates \
            --certificate /tmp/cert.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

          # The p12 was built manually via openssl (no local Mac), so the
          # Developer ID G2 intermediate never got installed the way
          # Keychain Access normally does it automatically. Without it,
          # codesign can't build the trust chain and fails with
          # errSecInternalComponent. Fetch and install it explicitly.
          curl -sSL -o /tmp/DeveloperIDG2CA.cer \
            "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
          DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          security import /tmp/DeveloperIDG2CA.cer -k "$DEFAULT_KEYCHAIN" -A

      - name: Flutter pub get
        script: flutter packages pub get

      - name: Build sing-box macOS framework (Libbox.xcframework)
        script: |
          git clone --branch v1.13.0-rc.1 --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box

          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

          gomobile bind -v -target=macos \
            -tags "with_wireguard,with_quic,with_utls,with_dhcp,with_gvisor,with_clash_api" \
            -o "$CM_BUILD_DIR/macos/Frameworks/Libbox.xcframework" \
            ./experimental/libbox

          # NOTE: unlike the iOS build, we do NOT flatten the
          # Versions/Current bundle structure here. That flattening was
          # required on iOS because iOS frameworks must be unversioned —
          # but this framework is being built FOR macOS, where the
          # classic versioned bundle layout is the correct, expected one.
          # Flattening it here would likely break codesigning.

          find "$CM_BUILD_DIR/macos/Frameworks/Libbox.xcframework" -name "Info.plist" -path "*Libbox.framework*" | while read -r plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.vulcainvpn.app.macos.PacketTunnel.Libbox" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.vulcainvpn.app.macos.PacketTunnel.Libbox" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$plist"
            echo "Patched $plist"
          done

      - name: Flutter build macos
        script: |
          flutter build macos --release
          APP_PATH=$(find "$CM_BUILD_DIR/build/macos/Build/Products/Release" -maxdepth 1 -name "*.app")
          echo "APP_PATH=$APP_PATH" >> $CM_ENV

      - name: Codesign app (hardened runtime)
        script: |
          CERT_NAME=$(keychain list-certificates | jq -r '.[0].common_name')
          echo "Signing with: $CERT_NAME"

          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$CERT_NAME" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        script: |
          mkdir -p /tmp/dmg_staging
          cp -R "$APP_PATH" /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create -volname "VulcainVPN" \
            -srcfolder /tmp/dmg_staging \
            -ov -format UDZO \
            "$CM_BUILD_DIR/VulcainVPN.dmg"

      - name: Notarize DMG
        script: |
          # When the app_store_connect integration is active, Codemagic points
          # APP_STORE_CONNECT_PRIVATE_KEY at an already-staged file on disk
          # using an "@file:/path" convention, rather than raw PEM content.
          # Handle both forms so this works whichever way it's provided.
          RAW_KEY="$APP_STORE_CONNECT_PRIVATE_KEY"

          if [[ "$RAW_KEY" == @file:* ]]; then
            KEY_PATH="${RAW_KEY#@file:}"
            echo "Using key file staged by Codemagic integration: $KEY_PATH"
          else
            KEY_PATH="/tmp/asc_key.p8"
            printf '%s' "$RAW_KEY" > "$KEY_PATH"
            echo "Wrote raw PEM content to $KEY_PATH"
          fi

          if [ ! -f "$KEY_PATH" ]; then
            echo "❌ Key file not found at $KEY_PATH"
            exit 1
          fi

          echo "=== Verifying key file format ==="
          head -1 "$KEY_PATH"
          echo ""
          wc -l "$KEY_PATH"

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "❌ Key file does not look like a valid PEM file."
            exit 1
          fi

          echo "=== Submitting for notarization (async — not waiting) ==="
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$CM_BUILD_DIR/VulcainVPN.dmg" \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID")

          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "  id:" | head -1 | awk '{print $2}')

          echo ""
          echo "=================================================================="
          echo "✅ Submitted to Apple's notary service (not waiting for result)."
          echo "   Submission ID: $SUBMISSION_ID"
          echo ""
          echo "   This build is DONE — Apple will process it in the background."
          echo "   The DMG in this build's artifacts is signed but NOT YET"
          echo "   notarized/stapled. Once Apple finishes (check from your own"
          echo "   Mac, no CI cost), run:"
          echo ""
          echo "     xcrun notarytool wait $SUBMISSION_ID \\"
          echo "       --key /path/to/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8 \\"
          echo "       --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \\"
          echo "       --issuer $APP_STORE_CONNECT_ISSUER_ID"
          echo ""
          echo "   Then, once that reports 'status: Accepted':"
          echo ""
          echo "     xcrun stapler staple VulcainVPN.dmg"
          echo "=================================================================="

          rm -f /tmp/asc_key.p8

    artifacts:
      - "*.dmg"

    publishing:
      email:
        recipients:
          - pierre.webdev@gmail.com
