workflows:
  ios-vulcainvpn:
    name: VulcainVPN iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: vulcainvpn_asc_key
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.vulcainvpn.app"
        EXT_BUNDLE_ID: "com.vulcainvpn.app.PacketTunnel"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing (main app + extension)
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          app-store-connect fetch-signing-files "$EXT_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter pub get
        script: flutter packages pub get

      - name: Strip alpha channel from App Store icon
        script: |
          brew list imagemagick &>/dev/null || brew install imagemagick
          find ios/Runner/Assets.xcassets/AppIcon.appiconset -name "*1024*.png" | while read -r icon; do
            magick "$icon" -background white -alpha remove -alpha off "$icon"
            echo "Stripped alpha from $icon"
          done

      - name: Build sing-box iOS framework
        script: |
          git clone --branch v1.13.0-rc.1 --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box

          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

          gomobile bind -v -target=ios,iossimulator \
            -tags "with_wireguard,with_quic,with_utls,with_dhcp,with_gvisor,with_clash_api" \
            -o "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" \
            ./experimental/libbox

          echo "=== DUMPING GENERATED OBJECTIVE-C HEADER (Libbox.objc.h) ==="
          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -name "Libbox.objc.h" | head -1 | xargs cat
          echo "=== END HEADER DUMP ==="

          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -name "Info.plist" -path "*Libbox.framework*" | while read -r plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.vulcainvpn.app.PacketTunnel.Libbox" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.vulcainvpn.app.PacketTunnel.Libbox" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$plist"
            /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 13.0" "$plist"
            echo "Patched $plist"
          done

          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -type d -name "Libbox.framework" | while read -r framework; do
            if [ -d "$framework/Versions" ]; then
              echo "Flattening versioned bundle: $framework"
              flat_tmp=$(mktemp -d)
              cp -RL "$framework/Versions/Current/." "$flat_tmp/"
              rm -rf "$framework"
              mkdir -p "$framework"
              cp -R "$flat_tmp/." "$framework/"
              rm -rf "$flat_tmp"
              echo "Flattened $framework"
            fi
            if [ -f "$framework/Resources/Info.plist" ] && [ ! -f "$framework/Info.plist" ]; then
              mv "$framework/Resources/Info.plist" "$framework/Info.plist"
              echo "Moved Info.plist to framework root in $framework"
            fi
            if [ -d "$framework/Resources" ] && [ -z "$(ls -A "$framework/Resources")" ]; then
              rmdir "$framework/Resources"
            fi
          done

      - name: Flutter build ipa
        script: |
          flutter build ipa --release --verbose \
            --build-number=$(date +%s) \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  macos-vulcainvpn:
    name: VulcainVPN macOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: vulcainvpn_asc_key
    environment:
      groups:
        - macos_signing
      vars:
        BUNDLE_ID: "com.vulcainvpn.app.macos"
        SING_BOX_VERSION: "1.13.0"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Developer ID signing
        script: |
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          keychain initialize
          keychain add-certificates \
            --certificate /tmp/cert.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Flutter pub get
        script: flutter packages pub get

      - name: Download and stage sing-box binaries
        script: |
          cd /tmp
          curl -L -o singbox-arm64.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-darwin-arm64.tar.gz"
          curl -L -o singbox-amd64.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-darwin-amd64.tar.gz"

          tar -xzf singbox-arm64.tar.gz
          tar -xzf singbox-amd64.tar.gz

          mkdir -p /tmp/singbox_staging
          cp "sing-box-${SING_BOX_VERSION}-darwin-arm64/sing-box" /tmp/singbox_staging/sing-box-arm64
          cp "sing-box-${SING_BOX_VERSION}-darwin-amd64/sing-box" /tmp/singbox_staging/sing-box-amd64
          chmod +x /tmp/singbox_staging/sing-box-arm64 /tmp/singbox_staging/sing-box-amd64

      - name: Flutter build macos
        script: |
          flutter build macos --release

      - name: Copy sing-box binaries into app bundle Resources
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/macos/Build/Products/Release" -maxdepth 1 -name "*.app")
          cp /tmp/singbox_staging/sing-box-arm64 "$APP_PATH/Contents/Resources/"
          cp /tmp/singbox_staging/sing-box-amd64 "$APP_PATH/Contents/Resources/"
          echo "APP_PATH=$APP_PATH" >> $CM_ENV

      - name: Codesign sing-box binaries and app (hardened runtime)
        script: |
          CERT_NAME=$(keychain list-certificates | jq -r '.[0].common_name')
          echo "Signing with: $CERT_NAME"

          codesign --force --options runtime --timestamp \
            --sign "$CERT_NAME" \
            "$APP_PATH/Contents/Resources/sing-box-arm64"
          codesign --force --options runtime --timestamp \
            --sign "$CERT_NAME" \
            "$APP_PATH/Contents/Resources/sing-box-amd64"

          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$CERT_NAME" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        script: |
          mkdir -p /tmp/dmg_staging
          cp -R "$APP_PATH" /tmp/dmg_staging/
          ln -s /Applications /tmp/dmg_staging/Applications
          hdiutil create -volname "VulcainVPN" \
            -srcfolder /tmp/dmg_staging \
            -ov -format UDZO \
            "$CM_BUILD_DIR/VulcainVPN.dmg"

      - name: Notarize DMG
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/asc_key.p8

          xcrun notarytool submit "$CM_BUILD_DIR/VulcainVPN.dmg" \
            --key /tmp/asc_key.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple "$CM_BUILD_DIR/VulcainVPN.dmg"
          rm -f /tmp/asc_key.p8

    artifacts:
      - "*.dmg"

    publishing:
      email:
        recipients:
          - pierre.webdev@gmail.com
