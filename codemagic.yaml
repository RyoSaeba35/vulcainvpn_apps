workflows:
  ios-vulcainvpn:
    name: VulcainVPN iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: vulcainvpn_asc_key
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.vulcainvpn.app"
        EXT_BUNDLE_ID: "com.vulcainvpn.app.PacketTunnel"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing (main app + extension)
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          app-store-connect fetch-signing-files "$EXT_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter pub get
        script: flutter packages pub get

      - name: Build sing-box iOS framework
        script: |
          git clone --branch v1.13.0-rc.1 --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box

          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

          gomobile bind -v -target=ios,iossimulator \
            -o "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" \
            ./experimental/libbox

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
