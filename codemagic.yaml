workflows:
  ios-vulcainvpn:
    name: VulcainVPN iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Set this up in Codemagic → Teams → Integrations → Apple Developer Portal
      # (generate an App Store Connect API key at appstoreconnect.apple.com → Users and Access → Keys)
      app_store_connect: vulcainvpn_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        # Both bundle IDs need to be registered in Apple Developer portal first
        bundle_identifier: com.vulcainvpn.app
      vars:
        BUNDLE_ID: "com.vulcainvpn.app"
        EXT_BUNDLE_ID: "com.vulcainvpn.app.PacketTunnel"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing (main app + extension)
        script: |
          # Fetches/creates provisioning profiles for BOTH bundle IDs automatically
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$EXT_BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter pub get
        script: flutter packages pub get

      - name: Build sing-box iOS framework
        script: |
          # This is Phase 1 — runs here because it needs macOS/Xcode toolchain
          # (gomobile bind for iOS requires clang/lipo from Xcode, unavailable on Linux)
          git clone https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          gomobile bind -v -target=ios,iossimulator \
            -o "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" \
            ./experimental/libbox
          # Adjust the target package path to match your sing-box fork's
          # mobile bindings — check ~/code/RyoSaeba35/sing-box-for-android
          # for what you already expose there, and mirror the same API surface.

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
