workflows:
  ios-vulcainvpn:
    name: VulcainVPN iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Set this up in Codemagic → Teams → Integrations → Apple Developer Portal
      # (generate an App Store Connect API key at appstoreconnect.apple.com → Users and Access → Keys)
      app_store_connect: vulcainvpn_asc_key
    environment:
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: "com.vulcainvpn.app"
        EXT_BUNDLE_ID: "com.vulcainvpn.app.PacketTunnel"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing (main app + extension)
        script: |
          # Uses a PERSISTENT certificate key stored as the CERTIFICATE_PRIVATE_KEY
          # env var (group: ios_signing) — NOT regenerated each build. Generating
          # a fresh random key per run was creating a new Distribution cert every
          # time, silently exhausting Apple's per-account certificate limit.
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          app-store-connect fetch-signing-files "$EXT_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter pub get
        script: flutter packages pub get

      - name: Build sing-box iOS framework
        script: |
          # Pinned to v1.13.0-rc.1 — same version the Android libbox.aar was built
          # from (RyoSaeba35/sing-box-for-android fork, version.properties).
          # Keeping platforms on the same core version avoids config/protocol
          # mismatches between Android and iOS builds.
          git clone --branch v1.13.0-rc.1 --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box

          # IMPORTANT: SagerNet uses their own gomobile fork, not golang.org/x/mobile
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

          gomobile bind -v -target=ios,iossimulator \
            -o "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" \
            ./experimental/libbox

          # gomobile bind doesn't set CFBundleIdentifier in the generated
          # framework's Info.plist — Apple's validator rejects empty/missing
          # bundle IDs on upload. Patch every platform slice's Info.plist.
          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -name "Info.plist" -path "*Libbox.framework*" | while read -r plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.vulcainvpn.app.PacketTunnel.Libbox" "$plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.vulcainvpn.app.PacketTunnel.Libbox" "$plist"
            echo "Patched $plist"
          done

          # Known gomobile bug: it generates iOS frameworks using the macOS-style
          # VERSIONED bundle layout (Framework/Versions/A/...), which Xcode links
          # fine but Apple's App Store validator rejects on upload ("binary file
          # is not permitted"). Flatten every Libbox.framework slice to the
          # unversioned layout iOS actually requires.
          find "$CM_BUILD_DIR/ios/Frameworks/Libbox.xcframework" -type d -name "Libbox.framework" | while read -r framework; do
            if [ -d "$framework/Versions" ]; then
              echo "Flattening versioned bundle: $framework"
              flat_tmp=$(mktemp -d)
              cp -RL "$framework/Versions/Current/." "$flat_tmp/"
              rm -rf "$framework"
              mkdir -p "$framework"
              cp -R "$flat_tmp/." "$framework/"
              rm -rf "$flat_tmp"
              echo "Flattened $framework"
            fi
          done
          # Same package path (experimental/libbox) that SFA binds for Android
          # and SagerNet's own SFI client binds for iOS — this is the shared
          # cross-platform entry point, same Go source either way.

      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
